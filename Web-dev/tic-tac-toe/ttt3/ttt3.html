<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="ttt3.css" />
    <script src="ttt3.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Tic Tac Toe</h1>

      <section class="controls">
        <input type="text" id="player1" placeholder="Player 1 name" />
        <input type="text" id="player2" placeholder="Player 2 name" />
        <button id="start-btn">Start/ Reset </button>
        
      </section>

      <p id="message">Press Start / Reset to begin.</p>

      <div id="gameboard"></div>


    </main>
  </body>
</html>
